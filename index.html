<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotto Generator</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <div class="container">
    <header>
      <h1>로또 번호 추첨기</h1>
      <button id="theme-toggle" class="btn-icon" aria-label="테마 변경">
        <span class="theme-icon">🌓</span>
      </button>
    </header>

    <main>
      <section class="controls">
        <div class="bonus-toggle-wrapper">
          <label class="switch">
            <input type="checkbox" id="bonus-toggle">
            <span class="slider round"></span>
          </label>
          <span>보너스 번호 포함</span>
        </div>
        <button id="draw-btn" class="btn-primary">번호 추첨하기</button>
      </section>

      <section id="animation-container" class="animation-container hidden">
        <div class="machine">
          <div class="ball ball-1"></div>
          <div class="ball ball-2"></div>
          <div class="ball ball-3"></div>
          <div class="ball ball-4"></div>
          <div class="ball ball-5"></div>
        </div>
        <p class="status-text">번호를 추첨 중입니다...</p>
      </section>

      <section id="results-container" class="results-container">
        <!-- 5 sets of results will be injected here -->
      </section>

      <section class="inquiry-section">
        <hr class="divider">
        <h2>🤝 제휴 문의</h2>
        <form action="https://formspree.io/f/mbdbezdp" method="POST" class="inquiry-form">
          <div class="form-group">
            <label for="name">성함 / 업체명</label>
            <input type="text" id="name" name="name" required placeholder="예: 홍길동 (주식회사 젬마)">
          </div>
          
          <div class="form-group">
            <label for="email">회신 받을 이메일</label>
            <input type="email" id="email" name="email" required placeholder="example@mail.com">
          </div>

          <div class="form-group">
            <label for="category">문의 유형</label>
            <select id="category" name="category">
              <option value="partnership">사업 제휴</option>
              <option value="marketing">마케팅/광고</option>
              <option value="technical">기술 문의</option>
              <option value="other">기타</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">문의 상세 내용</label>
            <textarea id="message" name="message" required placeholder="제휴하고 싶은 구체적인 내용을 적어주세요." rows="5"></textarea>
          </div>

          <input type="text" name="_gotcha" style="display:none">

          <button type="submit" class="btn-secondary">문의 제출하기</button>
          <p class="form-notice">
            * 전송 후 Formspree 확인 페이지로 이동합니다.
          </p>
        </form>
      </section>
    </main>
  </div>
  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
